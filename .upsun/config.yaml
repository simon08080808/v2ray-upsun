applications:
  app:
    source:
      root: "/"
    type: "python:3.11"
    hooks:
      build: |
        pip install gunicorn requests
    web:
      commands:
        start: "gunicorn -b 0.0.0.0:${PORT:-8080} server:app"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
