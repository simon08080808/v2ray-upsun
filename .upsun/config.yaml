applications:
  app:
    source:
      root: "/"
    type: "python:3.11"
    web:
      commands:
        start: "python3 server.py"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
