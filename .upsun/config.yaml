applications:
  app:
    source:
      root: "/"
    type: "golang:1.22"
    hooks:
      build: |
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -o xray.zip
        chmod +x xray
    web:
      commands:
        start: "./xray run -c config.json"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
