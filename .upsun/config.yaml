applications:
  app:
    source:
      root: "/"
    type: "python:3.11"
    hooks:
      build: |
        curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
        unzip -o xray.zip xray
        chmod +x xray
        echo "xray-build-v3"
    web:
      commands:
        start: "./xray run -config config.json"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: false
