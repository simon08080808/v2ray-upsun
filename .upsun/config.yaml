applications:
  app:
    source:
      root: "/"
    type: "python:3.11"
    hooks:
      build: |
        pip install mitmproxy
    web:
      commands:
        start: "mitmdump --mode reverse:http://simon.benbilal237free.xyz:80 --listen-port $PORT --no-anticache"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
