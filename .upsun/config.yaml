applications:
  app:
    source:
      root: "/"
    type: "python:3.11"
    dependencies:
      python:
        pip: "*"
    hooks:
      build: |
        pip install -r requirements.txt
    web:
      commands:
        start: "python main.py"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: false
