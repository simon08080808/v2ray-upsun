applications:
  app:
    source:
      root: "/"
    type: "python:3.11"
    hooks:
      build: |
        curl -L -o caddy "https://caddyserver.com/api/download?os=linux&arch=amd64"
        chmod +x caddy
    web:
      commands:
        start: "./caddy reverse-proxy --from :$PORT --to simon.benbilal237free.xyz:80 --change-host-header"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
